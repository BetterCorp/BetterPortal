name: Build

on:
  push:
    branches: [develop, master]
  pull_request:
    branches: [develop, master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nodejs:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    services:
      auth-postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: bp-test-only
          POSTGRES_DB: bp_auth_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      BP_AUTH_TEST_POSTGRES: postgres://postgres:bp-test-only@127.0.0.1:5432/bp_auth_test
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: node --test .github/actions/preview-environment/index.test.mjs
      - run: npm ci --workspaces --include-workspace-root
      - run: npm run build
      - run: npm run lint
      - run: npx playwright install --with-deps chromium
      - run: npm test

  ports:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.14']
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: framework/conformance/requirements*.txt
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: framework/dotnet/**/packages.lock.json

      - name: Install conformance dependencies and build Node peers
        run: |
          python -m pip install -r framework/conformance/requirements-ci.txt
          npm ci --workspaces --include-workspace-root
          npm run build --workspace @betterportal/plugin-bsb
          npm run build --workspace @betterportal/config-manager
          npm run build --workspace @betterportal/registry

      - name: Check canonical contracts
        run: |
          node framework/conformance/export-contracts.mjs --check
          node framework/conformance/export-fixtures.mjs --check
          node framework/conformance/export-encryption-fixtures.mjs --check

      - name: Build native projects with locked dependencies
        run: |
          dotnet restore framework/dotnet/Conformance --locked-mode
          dotnet restore framework/dotnet/BetterPortal.Tool --locked-mode
          dotnet build framework/dotnet/Conformance --no-restore -m:1 -p:UseSharedCompilation=false
          dotnet build framework/dotnet/BetterPortal.Tool --no-restore -m:1 -p:UseSharedCompilation=false

      - name: Check generated types and executable documentation
        run: |
          python framework/conformance/check_elevation.py
          dotnet framework/dotnet/Conformance/bin/Debug/net10.0/Conformance.dll --elevation framework/conformance/elevation-cases.json
          python framework/conformance/check_types.py
          python framework/conformance/check_clientgen.py
          python framework/conformance/check_projects.py
          python framework/conformance/check_registry_tools.py
          python framework/conformance/check_export.py
          python framework/conformance/check_discovery.py
          python framework/conformance/check_docs.py

      - name: Build and verify unpublished packages
        run: |
          dotnet pack framework/dotnet/BetterPortal --no-restore --output ports-artifacts/packages
          dotnet pack framework/dotnet/BetterPortal.AspNetCore --no-restore --output ports-artifacts/packages
          dotnet pack framework/dotnet/BetterPortal.Tool --no-restore --output ports-artifacts/packages
          python -m build framework/python --no-isolation --outdir ports-artifacts/packages
          python framework/conformance/check_packages.py ports-artifacts/packages
          python framework/conformance/check_scaffold.py ports-artifacts/packages

      # SDK and BP regressions fail this gate without exemptions.
      - name: Run the full HTTP interoperability gate
        run: python framework/conformance/verify.py --roundtrip-all --report ports-artifacts/conformance.json

      - name: Preserve packages and conformance report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-ports-python-${{ matrix.python }}
          path: ports-artifacts/
          retention-days: 14
