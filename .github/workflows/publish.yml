name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  actions: read
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  authorize-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Verify tag provenance and tested master head
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin master
          test "$(git rev-parse "$RELEASE_SHA^{commit}")" = "$(git rev-parse origin/master)"

          node <<'NODE'
          const { GH_TOKEN, REPOSITORY, RELEASE_SHA } = process.env;
          const url = new URL(`https://api.github.com/repos/${REPOSITORY}/actions/workflows/ci.yml/runs`);
          url.searchParams.set("head_sha", RELEASE_SHA);
          url.searchParams.set("branch", "master");
          url.searchParams.set("event", "push");
          url.searchParams.set("status", "success");
          url.searchParams.set("per_page", "10");

          const response = await fetch(url, {
            headers: {
              accept: "application/vnd.github+json",
              authorization: `Bearer ${GH_TOKEN}`,
              "x-github-api-version": "2022-11-28"
            }
          });
          if (!response.ok) {
            throw new Error(`Could not verify master Build workflow: HTTP ${response.status}`);
          }
          const body = await response.json();
          const valid = body.workflow_runs?.some((run) =>
            run.head_sha === RELEASE_SHA &&
            run.head_branch === "master" &&
            run.event === "push" &&
            run.status === "completed" &&
            run.conclusion === "success"
          );
          if (!valid) {
            throw new Error("Release commit has no successful master Build workflow");
          }
          NODE

  discover-workspaces:
    needs: authorize-release
    runs-on: blacksmith-4vcpu-ubuntu-2404
    outputs:
      plugin-workspaces: ${{ steps.workspaces.outputs.plugin-workspaces }}
      npm-workspaces: ${{ steps.workspaces.outputs.npm-workspaces }}
      bp-workspaces: ${{ steps.workspaces.outputs.bp-workspaces }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Discover plugin workspaces
        id: workspaces
        run: |
          echo "plugin-workspaces=$(node scripts/release/list-plugin-workspaces.mjs)" >> "$GITHUB_OUTPUT"
          echo "npm-workspaces=$(node scripts/release/list-plugin-workspaces.mjs --publishable)" >> "$GITHUB_OUTPUT"
          echo "bp-workspaces=$(node scripts/release/list-bp-workspaces.mjs)" >> "$GITHUB_OUTPUT"

  build-core:
    needs: authorize-release
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          scope: '@betterportal'

      - name: Install
        run: npm ci --workspaces --include-workspace-root

      - name: Verify workspace version matches tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          node scripts/release/set-workspace-version.mjs "$TAG" --check

      - name: Build core packages
        run: |
          npm run build -w @betterportal/framework
          npm run build -w @betterportal/plugin-bsb
          npm run build -w @betterportal/theme-runtime

  build-plugins:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs:
      - build-core
      - discover-workspaces
    strategy:
      fail-fast: false
      matrix:
        workspace: ${{ fromJSON(needs.discover-workspaces.outputs.plugin-workspaces) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          scope: '@betterportal'

      - name: Install
        run: npm ci --workspaces --include-workspace-root

      - name: Verify workspace version matches tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          node scripts/release/set-workspace-version.mjs "$TAG" --check

      - name: Build local core dependencies
        run: |
          npm run build -w @betterportal/framework
          npm run build -w @betterportal/plugin-bsb
          npm run build -w @betterportal/theme-runtime

      - name: Build package
        run: npm run build -w "${{ matrix.workspace }}" --if-present

  publish-core:
    runs-on: ubuntu-latest
    needs: build-plugins
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          scope: '@betterportal'

      - name: Install
        run: npm ci --workspaces --include-workspace-root

      - name: Verify workspace version matches tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          node scripts/release/set-workspace-version.mjs "$TAG" --check

      - name: Build core packages
        run: |
          npm run build -w @betterportal/framework
          npm run build -w @betterportal/plugin-bsb
          npm run build -w @betterportal/theme-runtime

      - name: Publish core packages
        run: |
          npm publish -w @betterportal/framework --access public
          npm publish -w @betterportal/plugin-bsb --access public

  publish-plugin-packages:
    runs-on: ubuntu-latest
    needs:
      - publish-core
      - discover-workspaces
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        workspace: ${{ fromJSON(needs.discover-workspaces.outputs.npm-workspaces) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          scope: '@betterportal'

      - name: Install
        run: npm ci --workspaces --include-workspace-root

      - name: Verify workspace version matches tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          node scripts/release/set-workspace-version.mjs "$TAG" --check

      - name: Build local core dependencies
        run: |
          npm run build -w @betterportal/framework
          npm run build -w @betterportal/plugin-bsb
          npm run build -w @betterportal/theme-runtime

      - name: Build package
        run: npm run build -w "${{ matrix.workspace }}" --if-present

      - name: Publish package
        run: npm publish -w "${{ matrix.workspace }}" --access public

  publish-bsb-schemas:
    runs-on: ubuntu-latest
    needs:
      - publish-plugin-packages
      - discover-workspaces
    strategy:
      fail-fast: false
      matrix:
        workspace: ${{ fromJSON(needs.discover-workspaces.outputs.plugin-workspaces) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          scope: '@betterportal'

      - name: Install
        run: npm ci --workspaces --include-workspace-root

      - name: Verify workspace version matches tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          node scripts/release/set-workspace-version.mjs "$TAG" --check

      - name: Build local core dependencies
        run: |
          npm run build -w @betterportal/framework
          npm run build -w @betterportal/plugin-bsb
          npm run build -w @betterportal/theme-runtime

      - name: Build package
        run: npm run build -w "${{ matrix.workspace }}" --if-present

      - name: Publish BSB registry schema
        env:
          BSB_REGISTRY_TOKEN: ${{ secrets.BSB_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          ws="${{ matrix.workspace }}"
          if [ ! -f "$ws/bsb-plugin.json" ]; then
            echo "No bsb-plugin.json in $ws; skipping BSB registry publish"
            exit 0
          fi
          if [ -z "${BSB_REGISTRY_TOKEN:-}" ]; then
            echo "::error::BSB_REGISTRY_TOKEN secret is required to publish BetterPortal plugin schemas"
            exit 1
          fi
          for attempt in 1 2 3; do
            log_file="$(mktemp)"
            if (cd "$ws" && npm run publish:client 2>&1 | tee "$log_file"); then
              exit 0
            fi
            if grep -q "Version .* already exists" "$log_file"; then
              echo "BSB registry version already exists for $ws; treating publish as complete"
              exit 0
            fi
            if [ "$attempt" = "3" ]; then
              break
            fi
            sleep $((attempt * 10))
          done
          exit 1

  publish-bp-contracts:
    # BP registry setup is deferred; enable this job once the registry is configured.
    if: false
    runs-on: ubuntu-latest
    needs:
      - publish-plugin-packages
      - discover-workspaces
    strategy:
      fail-fast: false
      matrix:
        workspace: ${{ fromJSON(needs.discover-workspaces.outputs.bp-workspaces) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'

      - name: Install
        run: npm ci --workspaces --include-workspace-root

      - name: Verify workspace version matches tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          node scripts/release/set-workspace-version.mjs "$TAG" --check

      - name: Build local dependencies and package
        run: |
          npm run build -w @betterportal/framework
          npm run build -w @betterportal/plugin-bsb
          npm run build -w @betterportal/theme-runtime
          npm run build -w "${{ matrix.workspace }}"

      - name: Publish BetterPortal contract
        env:
          BP_REGISTRY_TOKEN: ${{ secrets.BP_REGISTRY_TOKEN }}
        run: |
          if [ -z "${BP_REGISTRY_TOKEN:-}" ]; then
            echo "::error::BP_REGISTRY_TOKEN secret is required to publish BetterPortal contracts"
            exit 1
          fi
          umask 077
          token_file="$RUNNER_TEMP/bp-registry-token"
          trap 'rm -f "$token_file"' EXIT
          printf '%s' "$BP_REGISTRY_TOKEN" > "$token_file"
          npm run publish:bp -w "${{ matrix.workspace }}" -- --token-file "$token_file"
